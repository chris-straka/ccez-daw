[package]
name = "ccez-daw"
version = "0.1.0"
edition = "2021"

[lib]
name = "ccez_daw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ccez-core = { path = "../core" }
