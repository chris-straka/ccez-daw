[package]
name = "ccez-core"
version = "0.1.0"
edition = "2021"
description = "ccez-daw project/engine truth: project model, op log, IPC shapes, Rust-to-TS typegen"

[lib]
name = "ccez_core"
path = "src/lib.rs"

[[bin]]
name = "typegen"
path = "src/bin/typegen.rs"

[[bin]]
name = "plugin-worker"
path = "src/bin/plugin-worker.rs"

[[bin]]
name = "export-validator"
path = "src/bin/export-validator.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
libloading = "0.8"
wgpu = { version = "0.19", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
wasmtime = { version = "48.0.2", optional = true }

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
wasm-runtime = ["dep:wasmtime"]
