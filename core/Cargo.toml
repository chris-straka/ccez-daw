[package]
name = "ccez-core"
version = "0.1.0"
edition = "2021"
description = "ccez-daw project/engine truth: project model, op log, IPC shapes, Rust-to-TS typegen"

[lib]
name = "ccez_core"
path = "src/lib.rs"

[[bin]]
name = "typegen"
path = "src/bin/typegen.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
