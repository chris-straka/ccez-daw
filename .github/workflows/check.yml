name: check

# Cross-target Rust gates on every push and PR. Adopted from the ccezstudio
# lesson: per-OS `#[tauri::command]` attributes and Windows crate features
# only break the build on their own target, and nothing compiles those
# targets until release CI runs. These `cargo check` jobs compile every
# target the release workflow bundles, minus the bundling itself.
# Desktop only: there is no Android/mobile target in this repo.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Rust-to-TS typegen drift gate: ui/src/generated is committed, and the
  # build fails if it drifts from core/. Cheap, runs once on Linux.
  typegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install
      - run: bun run typegen -- --check

  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked --workspace
      - run: cargo test --locked --workspace

  rust-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - run: cargo check --locked --workspace --target x86_64-unknown-linux-gnu

  rust-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --locked --workspace --target ${{ matrix.target }}
