name: check

# Cross-target Rust gates on every push and PR. Adopted from the ccezstudio
# lesson: per-OS `#[tauri::command]` attributes and Windows crate features
# only break the build on their own target, and nothing compiles those
# targets until release CI runs. These `cargo check` jobs compile every
# target the release workflow bundles, minus the bundling itself.
# Desktop only: there is no Android/mobile target in this repo.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Rust-to-TS typegen drift gate: ui/src/generated is committed, and the
  # build fails if it drifts from core/. Cheap, runs once on Linux.
  typegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      # typegen builds ccez-core, whose cpal audio backend links ALSA.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: bun install
      - run: bun run typegen -- --check

  # TS side: strict typecheck + unit tests for both Bun workspaces. No Rust
  # needed (the generated bindings are committed; the job above guards them).
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
        working-directory: ui
      - run: bun run test
        working-directory: ui
      - run: bun run check
        working-directory: mcp
      - run: bun run test
        working-directory: mcp

  # Web-mode Playwright specs: Vite dev server + mocked Tauri IPC, so a
  # stock browser is all it needs (see ui/e2e/playwright.config.ts).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: ui
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: ui/test-results/
          retention-days: 7

  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked --workspace
      - run: cargo test --locked --workspace

  rust-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - run: cargo check --locked --workspace --target x86_64-unknown-linux-gnu
      - run: cargo test --locked --workspace --target x86_64-unknown-linux-gnu

  rust-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --locked --workspace --target ${{ matrix.target }}
